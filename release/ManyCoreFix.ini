[ManyCoreFix]
; ManyCoreFix by Meanderpaul_gaming - stops old games crashing on CPUs with lots of cores.
; Put ManyCoreFix.asi and this file in the game's scripts folder (needs Ultimate ASI Loader).
; Use ManyCoreFix.asi for 32-bit games and ManyCoreFix64.asi for 64-bit games.

; 1 = on, 0 = off
Enabled=1

; How many CPU threads the game may use. Lower it (4, then 2) if the game still crashes.
MaxCPUs=8

; 1 = also make the game *see* only MaxCPUs CPUs. Needed by games that crash just from
; counting too many CPUs (even when limited). Set 0 if a game behaves oddly.
SpoofCPUCount=1

; 1 = set NUMBER_OF_PROCESSORS for the game process too.
SetEnvironment=1

; 1 = write ManyCoreFix.log next to this file each launch. Send it with bug reports.
Log=1
