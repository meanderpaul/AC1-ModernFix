name: Release

# Builds everything (plugins on Linux, the AC1 installer with Inno Setup on Windows) and publishes
# a GitHub Release with the zips attached.
# Runs when a version tag (v1.0, v1.1, ...) is pushed, or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0)"
        required: true
        default: "v1.0"
      draft:
        description: "Create as a draft (only visible to you until you publish it)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + lld
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18
      - name: Build plugins
        env:
          CLANG: clang-18
          LLVM_BIN: /usr/lib/llvm-18/bin
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build AC1ModernFix-Setup.exe with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q installer\AC1ModernFix.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: dist/AC1ModernFix-Setup.exe

  release:
    needs: [build, installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: setup
          path: dist

      - name: Package zips
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p pkg
          cp dist/AC1AffinityFix.asi release/AC1AffinityFix.ini release/install.bat pkg/
          (cd pkg && zip -9 "../AC1AffinityFix-$TAG.zip" AC1AffinityFix.asi AC1AffinityFix.ini install.bat)
          (cd dist && zip -9 "../AC1ModernFix-Setup-$TAG.zip" AC1ModernFix-Setup.exe)
          mkdir -p mcf && cp dist/ManyCoreFix.asi dist/ManyCoreFix64.asi release/ManyCoreFix.ini docs/MANYCOREFIX.md mcf/
          (cd mcf && zip -9 "../ManyCoreFix-$TAG.zip" *)
          unzip -l "AC1ModernFix-Setup-$TAG.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "AC1ModernFix-Setup-$TAG.zip" "AC1AffinityFix-$TAG.zip" "ManyCoreFix-$TAG.zip" \
            --title "AC1 Modern Fix $TAG" \
            --notes-file .github/release-notes.md \
            --target "${{ github.sha }}" ${{ inputs.draft && '--draft' || '' }}
